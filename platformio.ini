; PlatformIO Configuration for Intelligent Solid Waste Segregation System
; Primary Physical Target: Arduino Uno (ATmega328P)
; Secondary Legacy Target: ESP32 DevKit V1

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    arduino-libraries/Servo@^1.2.1
build_flags =
    -Wall

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bogde/HX711@^0.7.5
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
monitor_filters = esp32_exception_decoder

