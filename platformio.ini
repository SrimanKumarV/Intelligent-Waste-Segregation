; PlatformIO Configuration for Intelligent Solid Waste Segregation System
; Board: ESP32 DevKit V1 (30-pin or 38-pin)
; Framework: Arduino
;
; To build:  pio run
; To upload: pio run --target upload
; To monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps =
    bogde/HX711@^0.7.5

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; Serial monitor filters
monitor_filters = esp32_exception_decoder
