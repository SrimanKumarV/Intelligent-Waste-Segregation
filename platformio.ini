; PlatformIO Configuration for Intelligent Solid Waste Segregation System
; Multi-Microcontroller Architecture:
; Target A: Arduino Uno (ATmega328P, 5V TTL) — Module A: Proximity & Autonomous Lid Controller
; Target B: ESP32 DevKit V1 (3.3V Logic)   — Module B: Dual Moisture (C1/C2) & Dual HX711 (LC1/LC2) Sensor Hub

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    arduino-libraries/Servo@^1.2.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -Wall

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<../firmware/esp32/*> -<*.cpp>
lib_deps =
    bogde/HX711@^0.7.5
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
monitor_filters = esp32_exception_decoder
